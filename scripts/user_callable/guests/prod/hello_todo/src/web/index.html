<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <p class="meta">Served by <span id="hostname">…</span> · <span id="count">0</span> of <span id="limit">100</span> todos</p>
    <form id="add">
      <input id="title" name="title" maxlength="200" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <ul id="todos"></ul>
    <p class="meta" id="empty" hidden>Nothing to do.</p>
  </main>
</body>
</html>
