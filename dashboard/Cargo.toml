[workspace]
resolver = "2"
members = ["engine", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
# The highest rust-version among locked dependencies (Tauri 2). Raise it when
# `cargo update` pulls in a crate that needs a newer compiler.
rust-version = "1.90"
license = "GPL-3.0-only"
authors = ["BEENTHERE VENTURES, INC."]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2"
libc = "0.2"
dirs = "7"

# Keep LTO thin and codegen-units at its default: fat LTO or a single codegen
# unit runs the final optimization of the whole app on one core.
[profile.release]
lto = "thin"
strip = true
