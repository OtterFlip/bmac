# Unattended upgrades must not restart bmac-backupd: a restart cuts every pull
# and export in progress and ends every UI session. Its TLS is built in, so a
# library update seldom concerns it; the next reboot or upgrade of the package
# restarts it.
$nrconf{override_rc}{qr(^bmac-backupd\.service$)} = 0;
